name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 11 hours to prevent 12-hour inactivity sleep
    - cron: "0 */11 * * *"
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Playwright Wake-Up Automation
        run: python .github/scripts/wake_up.py
