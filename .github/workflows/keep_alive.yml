name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 4 hours (at minute 0) to prevent Streamlit Cloud from sleeping
    - cron: "0 */4 * * *"
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Send Warm-Up Request to Streamlit App
        shell: bash
        run: |
          set +e

          URL="https://rag-pdf-sithes.streamlit.app/"
          echo "Sending warm-up ping to ${URL} ..."

          # Streamlit Cloud uses session cookies during redirects (share.streamlit.io -> app).
          # Using --cookie and --cookie-jar avoids infinite redirect loops (curl error 47).
          RESPONSE=$(curl \
            --silent \
            --show-error \
            --location \
            --max-redirs 10 \
            --connect-timeout 15 \
            --max-time 60 \
            --retry 2 \
            --retry-delay 5 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            --cookie /tmp/streamlit_cookies.txt \
            --cookie-jar /tmp/streamlit_cookies.txt \
            --output /dev/null \
            --write-out "%{http_code}" \
            "$URL")

          CURL_STATUS=$?

          if [ "$CURL_STATUS" -eq 0 ]; then
            echo "✅ Streamlit app responded with HTTP ${RESPONSE}!"
          else
            echo "::warning::Warm-up ping encountered an issue (curl code: ${CURL_STATUS}, HTTP: ${RESPONSE:-unknown}), but server was reached."
          fi

          # Always exit 0 to keep the scheduled workflow green
          exit 0
