name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 4 hours (at minute 0) to prevent sleep and auto-wake if hibernating
    - cron: "0 */4 * * *"
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Playwright Wake-Up Automation
        run: python .github/scripts/wake_up.py
